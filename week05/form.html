<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="omisore kazeem bayo">
    <meta name="description" content="The product review form page for the product review website. it contains a form that allows users to submit their reviews for a product.">
    <title>Product Review Form</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main class="form-container">
        <form id="productReviewForm" action="review.html" method="get" class="review-form">

            <!-- Product Name -->
            <label for="productSelect">Product Name</label>

            <select id="productSelect" name="productSelect" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>


            <!-- Overall Rating -->
            <label>Overall Rating</label>
            
            <div class="rating">
                <div>
                    <label for="rating1">☆</label>
                    <input type="radio" id="rating1" name="rating" value="1" required>
                </div>
            
                <div>
                    <label for="rating2">☆☆</label>
                    <input type="radio" id="rating2" name="rating" value="2" required>
                </div>
            
                <div>
                    <label for="rating3">☆☆☆</label>
                    <input type="radio" id="rating3" name="rating" value="3" required>
                </div>
            
                <div>
                    <label for="rating4">☆☆☆☆</label>
                    <input type="radio" id="rating4" name="rating" value="4" required>
                </div>
            
                <div>
                    <label for="rating5">☆☆☆☆☆</label>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                </div>
            </div>


            <!-- Date of Installation -->
            <label for="installDate">Date of Installation</label>

            <input type="date" id="installDate" name="installDate" required>


            <!-- Useful Features -->
            <label>Which features did you find useful in the product?</label>
            <p><em>(Check all that apply)</em></p>
            
            <label for="durability">
                <input type="checkbox" id="durability" name="features" value="Durability">
                Durability
            </label>
            
            <label for="ease">
                <input type="checkbox" id="ease" name="features" value="Ease of Use">
                Ease of Use
            </label>
            
            <label for="performance">
                <input type="checkbox" id="performance" name="features" value="Performance">
                Performance
            </label>
            
            <label for="design">
                <input type="checkbox" id="design" name="features" value="Design">
                Design
            </label>

            <!-- Written Review -->
            <label for="review">
                Written Review <span>(Optional)</span>
            </label>

            <textarea id="review" name="review"></textarea>


            <!-- User Name -->
            <label for="userName">
                Your Name <span>(Optional)</span>
            </label>

            <input type="text" id="userName" name="userName">


            <!-- Submit Button -->
            <input type="submit" value="Post Review">

        </form>
    </main>


    <!-- Footer -->
    <footer>
        <p>
            © <span id="currentyear"></span>
            🌸 Kazeem Bayo Omisore 🌸 Nigeria
        </p>
    
        <p id="lastModified"></p>
    </footer>

</body>

</html>
